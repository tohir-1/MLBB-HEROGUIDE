<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroes | MLBB HeroGuide</title>
<meta name="description" content="Browse all Mobile Legends heroes with filters, sorting and search.">
<meta property="og:title" content="Heroes | MLBB HeroGuide"><meta property="og:description" content="Browse all Mobile Legends heroes with filters, sorting and search."><meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l11 4v9c0 7-5 12-11 15C10 27 5 22 5 15V6z' fill='%238B5CF6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('hg_theme'))||'dark'}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="wrap sec"><h1>Heroes</h1><p class="muted" id="count">Loading…</p>
<div class="filters card pad"><input id="fQ" type="search" placeholder="Search by name, role, lane..." aria-label="Search heroes">
<select id="fLane" aria-label="Lane"></select><select id="fDiff" aria-label="Difficulty"></select>
<select id="fSort" aria-label="Sort"><option value="az">A–Z</option><option value="za">Z–A</option><option value="diff">Difficulty</option><option value="new">Recently added</option></select>
<button class="btn ghost clear">Clear filters</button></div>
<div class="chips" id="roleChips" role="group" aria-label="Role filter"></div>
<div class="grid" id="grid"></div>
<div class="state" id="empty" hidden><h2>No heroes found</h2><p class="muted">Try different filters or search words.</p><button class="btn clear">Clear filters</button></div>
<div class="center"><button class="btn ghost" id="more" hidden>Load More</button></div></section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem;text-align:center">Please enable JavaScript to use HeroGuide.</p></noscript>
<script type="module" src="js/heroes.js"></script>
</body>
</html>

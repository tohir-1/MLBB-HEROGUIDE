<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds | MLBB HeroGuide</title>
<meta name="description" content="Browse hero builds and create your own custom builds.">
<meta property="og:title" content="Builds | MLBB HeroGuide"><meta property="og:description" content="Browse hero builds and create your own custom builds."><meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l11 4v9c0 7-5 12-11 15C10 27 5 22 5 15V6z' fill='%238B5CF6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('hg_theme'))||'dark'}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="wrap sec"><h1>Builds</h1>
<div class="filters card pad"><select id="bHero" aria-label="Hero"></select><select id="bRole" aria-label="Role"></select><select id="bLane" aria-label="Lane"></select><select id="bType" aria-label="Build type"></select><button class="btn ghost" id="bClear">Clear</button></div>
<div class="grid3" id="bGrid"></div>
<div class="state" id="bEmpty" hidden><h2>No builds found</h2><p class="muted">Change the filters to see more builds.</p></div></section>
<section class="wrap sec" id="creator"><h2>Custom Build Creator</h2>
<form id="cForm" class="card pad form" novalidate><label>Build name<input id="cName" maxlength="40" placeholder="My burst build"></label>
<label>Hero<select id="cHero"></select></label><fieldset><legend>Items (6)</legend><div class="grid3" id="cItems"></div></fieldset>
<div class="grid3"><label>Emblem<select id="cEmblem"></select></label><label>Talent<select id="cTalent"></select></label><label>Battle Spell<select id="cSpell"></select></label></div>
<div class="row"><button class="btn" id="cSave" type="submit">Save Build</button><button class="btn ghost" id="cReset" type="button">Reset</button></div></form></section>
<section class="wrap sec"><h2>My Builds</h2><div class="grid3" id="myBuilds"></div></section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem;text-align:center">Please enable JavaScript to use HeroGuide.</p></noscript>
<script type="module" src="js/builds.js"></script>
</body>
</html>
